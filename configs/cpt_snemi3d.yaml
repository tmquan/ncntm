# =====================================================================
# pretrain_snemi3d.yaml  --  VoxelDiT2-3D (H/16, ~1B) self-supervised
# pretraining on SNEMI3D / Kasthuri 2015 raw EM only (no segmentation)
# =====================================================================
# Every batch is task ``ssl``: reconstruct clean 4 nm EM from a degraded
# large-voxel input (RandResolutionDegraded).  The backbone is a pixel-space
# diffusion transformer on 16^3 voxel patches (no VAE); the rectified-flow
# term runs on voxels.  Volumes are those in data/SNEMI3D (see
# docs/DATASETS.md).
#
# The head is still 32 channels (30 affinity offsets + sem + raw) so a later
# SFT run can load this checkpoint without a head-shape change.
#
# Volumes resolve under $NCNTM_DATA_DIR (default: <cwd>/data); missing
# volumes are skipped with a warning, so run from the repo root.
# The 2-D PixelDiT2 checkpoint comes from $NCNTM_CACHE_DIR (default
# ~/.cache/ncntm/pixeldit2); timm caches DINOv3 in the HuggingFace cache.
# =====================================================================

experiment_name: ncntm-pixeldit2-h16-pretrain-snemi3d
project_name: ncntm
seed: 42
ckpt_path: null
ckpt_path_skip_prefixes: []
ckpt_path_only_prefixes: null

snemi3d_root: ${oc.env:NCNTM_DATA_DIR,${hydra:runtime.cwd}/data}/SNEMI3D

data:
  # Fixed fine network grid: 4 nm cubic voxel, patch (z, y, x).  16^3 voxel
  # DiT patches -> token grid (16, 16, 16), 4096 tokens.
  patch_size: [256, 256, 256]
  pixel_size: [4, 4, 4]
  # Train-only z/y/x permutation (cubic FOV); section degradation follows
  # the native section axis.
  rand_transpose_zyx: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 8
  # Crop gates on the per-volume [0,1] scale: non-zero fraction, std, and
  # lag-1 autocorrelation (real ultrastructure ~0.6-0.8, noise ~0).
  ssl_min_foreground: 0.7
  ssl_min_std: 0.05
  ssl_min_autocorr: 0.5
  balance: dataset
  within_dataset: tissue

  # Augment (whole-crop gamma) is in the loss target; Corrupt (per-section
  # jitter / gamma / noise) and Missing (whole native sections) touch the
  # input only.  30x6x6 crops are anisotropic: one in-plane axis is
  # downsampled to the 30 nm z spacing with probability fine_axis_prob.
  degrade:
    zf_range: [2.0, 10.0]
    fine_axis_prob: 0.8
    slab_mean_prob: 0.5
    volume_contrast_prob: 0.5
    volume_contrast_gamma: [0.8, 1.25]
    jitter_prob: 0.5
    max_jitter: 2.0
    contrast_prob: 0.5
    contrast_gamma: [0.8, 1.25]
    noise_prob: 0.3
    noise_std: 0.01
    missing_prob: 0.3
    max_missing: 2
    missing_fill: zero

  branches:
    ssl:
      task: ssl
      batch_size: 4
      sample_weight: 1.0
      volumes:
      # Kasthuri cropping (cc): x 2512-8416, y 4432-9248, z 0-1848.  It
      # contains AC4 and the cylinder's lower half, and overlaps AC3 in y
      # 8712-9248, so the val volumes below are not a spatial holdout.
      - vol: neurons_cc_5904x4816x1848_x2512_y4432_z0_volume
        root: ${snemi3d_root}
        dataset: kasthuri_cc
        native_resolution: [30, 6, 6]
        imaging: ssSEM
      # Kasthuri cylinder (cc) image: adds y 9248-10100 outside the cropping.
      - vol: neurons_cc_5000x2900x300_x3000_y7200_z950_volume
        root: ${snemi3d_root}
        dataset: kasthuri_cc
        native_resolution: [30, 6, 6]
        imaging: ssSEM
  val_batch_size: 4
  # One group per dataset name: 4 SNEMI3D groups x 16 crops / batch 2 = 32 batches.
  val_balance: dataset
  val_num_samples: 100
  val_volumes:
  - vol: AC3_cc_inputs
    root: ${snemi3d_root}
    dataset: AC3_cc
    task: ssl
    native_resolution: [30, 6, 6]
    imaging: ssSEM
  - vol: AC4_cc_inputs
    root: ${snemi3d_root}
    dataset: AC4_cc
    task: ssl
    native_resolution: [30, 6, 6]
    imaging: ssSEM
  # Uncorrected-contrast copies of the same tissue: tracks robustness to the
  # per-slice brightness swings the cc training data does not have.
  - vol: AC3_em_inputs
    root: ${snemi3d_root}
    dataset: AC3_em
    task: ssl
    native_resolution: [30, 6, 6]
    imaging: ssSEM
  - vol: AC4_em_inputs
    root: ${snemi3d_root}
    dataset: AC4_em
    task: ssl
    native_resolution: [30, 6, 6]
    imaging: ssSEM

model:
  type: joint3d_voxeldit       # JointVoxelDiT3DModule (VoxelDiT2-3D)
  variant: H/16                # hidden 1280, 32 blocks, 16^3 voxel patches
  in_channels: 1
  head_channels: 32            # len(loss.seg.offsets)=30 + sem + raw
  feature_size: 64
  pixel_channels: 16           # unpatchified DiT features fed to the head
  dropout: 0.5
  # Inflate the released 2-D nvidia/PixelDiT2-ImageNet H/16 (256 px) weights
  # to 3-D; false trains the same geometry from random init.
  pretrained: true
  dtype: bf16                  # paired with training.precision bf16-true
  # Only the DINOv3 grounding encoder is frozen; the DiT, its grounding
  # projector and the task head train.
  freeze_dit_backbone: false
  # Tri-planar grounding: DINOv3 ViT-S/16 on every 4th section along z, y
  # and x, averaged onto the 16^3 token grid.
  grounding_encoder: dinov3_vits16
  grounding_axes: [z, y, x]
  grounding_slice_stride: 4
  gradient_checkpointing: false
  # The task forward reads the DiT at the degraded endpoint of the flow.
  feature_timestep: 1.0

optimizer:
  lr: 6.0e-5
  weight_decay: 0.0001
  betas: [0.9, 0.99]
  master_dtype: fp32
  scheduler:
    type: cosine_warmup
    T_max: 101
    eta_min: 6.0e-6
    warmup_epochs: 1
  dit_backbone_lr: 6.0e-5

# Joint3DReconSegLoss, reconstruction only.  The seg block only fixes the
# 32-channel head layout; weight_seg is 0 and no sft batch is drawn.
loss:
  type: joint3d
  recon_loss: l1
  weight_rec: 1.0
  weight_dif: 1.0
  diffusion_steps: 35
  weight_seg: 0.0
  weight_ssl: 5.0
  weight_sft: 0.0
  # Residual next-scale reconstruction, coarse to fine; a scale is scored
  # only when the crop was measured at least that finely.
  var:
    enabled: true
    fine_nm: 4
    scales_nm: [32, 16, 8, 4]
  # seg:
  #   ignore_index: -100
  #   background: -1
  #   n_pull: 5
  #   offsets:
  #   - [-1, 0, 0]
  #   - [0, -1, 0]
  #   - [0, 0, -1]
  #   - [0, -1, -1]
  #   - [0, 1, -1]
  #   - [-2, 0, 0]
  #   - [-3, 0, 0]
  #   - [-4, 0, 0]
  #   - [-5, 0, 0]
  #   - [-8, 0, 0]
  #   - [0, -2, 0]
  #   - [0, 0, -2]
  #   - [0, -4, 0]
  #   - [0, 0, -4]
  #   - [0, -8, 0]
  #   - [0, 0, -8]
  #   - [0, -16, 0]
  #   - [0, 0, -16]
  #   - [0, -32, 0]
  #   - [0, 0, -32]
  #   - [0, -2, -2]
  #   - [0, 2, -2]
  #   - [0, -4, -4]
  #   - [0, 4, -4]
  #   - [0, -8, -8]
  #   - [0, 8, -8]
  #   - [0, -16, -16]
  #   - [0, 16, -16]
  #   - [0, -32, -32]
  #   - [0, 32, -32]
  #   weight_aff:
  #     weight: 1.0
  #     lambda_bce: 1.0
  #     lambda_dice: 1.0
  #     lambda_focal: 1.0
  #     gamma: 3.0
  #     pull_weight: 1.0
  #     push_weight: 3.0
  #     mask_to_foreground: true
  #     class_balance: auto
  #     class_balance_clip: 10.0
  #     dice_two_sided: true
  #   weight_sem:
  #     weight: 1.0
  #     lambda_bce: 1.0
  #     lambda_dice: 1.0
  #     lambda_focal: 1.0
  #     gamma: 3.0
  #     class_balance: auto
  #     class_balance_clip: 10.0
  #     dice_two_sided: true

training:
  # Constructed by the module but never run (ssl batches carry no labels).
  mutex_watershed:
    strides: [1, 1, 1]
    size_filter: 50
    backend: auto
    buckets: 16
    max_push_edges: null
    gate_with_sem: true
    sem_gate_threshold: 0.5
    grow_boundaries: false
    grow_max_distance: 0.0
  max_epochs: 101
  accelerator: auto
  devices: auto
  strategy: ddp
  use_distributed_sampler: false
  precision: bf16-true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  limit_train_batches: 500
  # 32 val batches (see val_num_samples); 40 covers the per-rank shard.
  limit_val_batches: 40
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 2
  log_every_n_steps: 100
  log_recon_steps: false
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  benchmark: true
  fast_dev_run: false
  resume_from_checkpoint: null

callbacks:
  checkpoint:
    enabled: true
    dirpath: null
    filename: '{epoch:02d}-{val/automatic/loss:.4f}'
    save_top_k: 3
    monitor: val/automatic/loss
    mode: min
    save_last: true
    verbose: true
  # Trainable weights only, ~2 GB each in bf16; save_top_k -1 keeps all.
  weights_checkpoint:
    enabled: true
    every_n_epochs: 20
    save_top_k: -1
  lr_monitor:
    enabled: true
  image_logger:
    enabled: true
    every_n_epochs: 1
    max_images: 8
  cuda_empty_cache_before_val: true
  memory_logger:
    enabled: true
    log_every_n_steps: null

output_dir: ${oc.env:HOME}/outputs/ncntm

hydra:
  job:
    chdir: false
